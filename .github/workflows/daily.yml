name: PIS daily digest

on:
  schedule:
    # 22:05 UTC = 06:05 北京时间。定时任务高峰期常延迟 5-30 分钟，深度解析多时整次运行可能要 20-40 分钟，
    # 提前到 6 点出头开始，保证 8 点前一定生成好
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's page if it exists"
        type: boolean
        default: false
      backfill:
        description: "补做深度解析：填 arXiv 链接/编号或文章链接，多个用空格分隔（留空 = 正常生成每日简报）"
        type: string
        default: ""
      date:
        description: "补做时链接到哪天的页面（YYYY-MM-DD，留空 = 今天）"
        type: string
        default: ""

concurrency:
  group: pis-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API }}
          NOTION_TOKEN: ${{ secrets.PERSONAL_INFORMATION_SOURCE }}   # Notion 集成 token
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API rate limit for repo READMEs
          BACKFILL: ${{ inputs.backfill }}
          BACKFILL_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -n "$BACKFILL" ]; then
            python -m pis.backfill "$BACKFILL" ${BACKFILL_DATE:+--date "$BACKFILL_DATE"}
          else
            python -m pis.main $FORCE
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-markdown
          path: out/*.md
          retention-days: 30
