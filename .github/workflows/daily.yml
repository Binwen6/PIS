name: PIS daily digest

on:
  schedule:
    # 23:30 UTC = 07:30 北京时间。GitHub 的定时任务高峰期常延迟 5-30 分钟，提前半小时保证 8 点前到达
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's page if it exists"
        type: boolean
        default: false

concurrency:
  group: pis-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API }}
          NOTION_TOKEN: ${{ secrets.PERSONAL_INFORMATION_SOURCE }}   # Notion 集成 token
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python -m pis.main ${{ inputs.force && '--force' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-markdown
          path: out/*.md
          retention-days: 30
