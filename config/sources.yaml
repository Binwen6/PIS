# PIS 信息源配置
timezone: Asia/Shanghai

notion:
  pis_page_id: 40ad4b61-755e-80b0-a159-f34c3f246739   # 「PIS-Personal Information Source」
  pis_page_title: PIS                                  # pis_page_id 为空时按标题搜索
window_hours: 26          # 回看窗口（略大于 24h，防止定时任务延迟漏掉内容）

llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash    # 最新 Flash（V4.1-Flash）；可用 GitHub 仓库变量 DEEPSEEK_MODEL 覆盖
  fallback_models: [deepseek-chat]   # 模型名被拒绝时自动回退
  score_batch_size: 40     # 相关度打分时每批多少条
  max_workers: 4

arxiv:
  enabled: true
  # arXiv 每日公告 RSS，周末/节假日没有新公告属正常
  # cs.MA 多智能体 · q-bio.NC 神经与认知 · eess.AS/cs.SD 音频与听觉 · cs.HC 含部分 BCI 工作
  categories: [cs.CL, cs.LG, cs.AI, cs.MA, cs.CV, q-bio.NC, eess.AS, cs.SD, cs.HC]
  include_cross_lists: true
  prefilter_max: 800       # 超过这个数量时先用关键词粗筛，节省 token
  min_score: 6             # 0-10，低于此分不进入摘要
  max_in_digest: 15

deep_dive:
  enabled: true            # 12 问深度解析（读 arXiv 全文），写入「论文库」并挂在每日主题下
  min_score: 8             # 论文相关度 ≥ 此分才做深度解析
  include_inbox: true      # 你收藏的文章：含 arXiv 链接则解读原论文，否则解读文章本身
  min_article_chars: 1500  # 不含 arXiv 链接的收藏，正文至少这么长才解读
  max_items: 6             # 每天最多几篇（收藏优先，其次按相关度）
  max_chars: 60000         # 送入模型的全文上限（字符）
  max_tokens: 8000
  workers: 3

huggingface_daily:
  enabled: true            # HF Daily Papers：社区热度信号（upvotes）

notion_inbox:
  enabled: true            # 读取 Notion「📥 Inbox」数据库中未处理的链接（公众号/小红书/知乎等手动收藏）

feeds:
  min_score: 6
  max_in_digest: 10
  list:
    - {name: OpenAI News,        kind: blog, url: "https://openai.com/news/rss.xml"}
    - {name: Google DeepMind,    kind: blog, url: "https://deepmind.google/blog/rss.xml"}
    - {name: Google Research,    kind: blog, url: "https://research.google/blog/rss/"}
    - {name: Hugging Face Blog,  kind: blog, url: "https://huggingface.co/blog/feed.xml"}
    - {name: BAIR Blog,          kind: blog, url: "https://bair.berkeley.edu/blog/feed.xml"}
    # ---- 以下需要你自己部署 RSSHub / wewe-rss 后把地址填进来 ----
    # X / Twitter（RSSHub，需要配置 X 的 cookie/token）
    # - {name: "X @karpathy", kind: social, url: "https://<your-rsshub>/twitter/user/karpathy"}
    # 知乎用户动态（RSSHub，需 cookie）
    # - {name: "知乎 某答主", kind: social, url: "https://<your-rsshub>/zhihu/people/activities/<id>"}
    # 小红书用户笔记（RSSHub，反爬强、经常失效）
    # - {name: "小红书 某博主", kind: social, url: "https://<your-rsshub>/xiaohongshu/user/<user_id>/notes"}
    # 微信公众号（wewe-rss，基于微信读书订阅公众号）
    # - {name: "机器之心", kind: wechat, url: "https://<your-wewe-rss>/feeds/<feed_id>.atom"}
